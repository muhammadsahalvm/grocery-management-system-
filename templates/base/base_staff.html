{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Salam Mart</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{% static 'css/variables.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/reset.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/layout.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/components.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/utilities.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/staff.css' %}">

</head>

<body>

<div class="app-layout">

    {% include "components/app_sidebar_staff.html" %}

    <div class="main-content">

      {% include "components/app_header.html" with page_title=page_title %}

            <main class="page-container">

                  {% block content %}
                  {% endblock %}

            </main>

    </div>

</div>

<script src="{% static 'js/staff.js' %}"></script>

</body>

</html>
