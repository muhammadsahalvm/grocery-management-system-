<div
    id="updateStockModal"
    class="modal-overlay">

    <div
        class="modal-box stock-modal">

        <button
            type="button"
            class="modal-close"
            id="closeStockModal">

            <i class="bi bi-x-lg"></i>

        </button>


        <div class="stock-modal-icon">

            <i class="bi bi-box-seam"></i>

        </div>


        <div class="stock-modal-header">

            <span class="stock-modal-label">
                Inventory
            </span>

            <h2>
                Update Stock
            </h2>

            <p>
                Update the available quantity for this product.
            </p>

        </div>


        <div class="stock-product-preview">

            <div class="stock-preview-icon">

                <i class="bi bi-box"></i>

            </div>

            <div>

                <strong id="stockProductName">
                    Product
                </strong>

                <span>
                    Current stock:
                    <b id="currentStock">
                        0
                    </b>
                </span>

            </div>

        </div>


        <form
            method="POST"
            id="updateStockForm">

            {% csrf_token %}

            <div class="form-group">

                <label for="stockQuantity">
                    New Stock Quantity
                </label>

                <input
                    type="number"
                    id="stockQuantity"
                    name="quantity"
                    min="0"
                    required>

                <small>
                    Enter 0 if the product is currently out of stock.
                </small>

            </div>


            <div class="modal-buttons">

                <button
                    type="button"
                    class="btn stock-cancel-btn"
                    id="cancelStockUpdate">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check2"></i>

                    Update Stock

                </button>

            </div>

        </form>

    </div>

</div>
